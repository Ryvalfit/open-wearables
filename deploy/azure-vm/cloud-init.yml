#cloud-config
package_update: true
packages:
  - ca-certificates
  - curl
  - python3
  - python3-psycopg2
  - postgresql-client
  - unzip
  - unattended-upgrades
write_files:
  - path: /usr/local/sbin/hero-wearables-host-setup
    permissions: '0750'
    content: |
      #!/bin/bash
      set -euo pipefail
      disk=/dev/disk/azure/scsi1/lun0
      if [ ! -b "$disk" ]; then disk=/dev/disk/azure/data/by-lun/0; fi
      test -b "$disk"
      # Only initialize the newly attached empty data disk. Never reformat a filesystem.
      if ! blkid "$disk" >/dev/null 2>&1; then mkfs.ext4 -L hero-ow-docker "$disk"; fi
      mkdir -p /var/lib/docker
      disk_uuid=$(blkid -s UUID -o value "$disk")
      grep -q "UUID=$disk_uuid " /etc/fstab || printf 'UUID=%s /var/lib/docker ext4 defaults 0 2\n' "$disk_uuid" >> /etc/fstab
      mountpoint -q /var/lib/docker || mount /var/lib/docker
      install -m 0755 -d /etc/apt/keyrings
      curl --fail --silent --show-error --max-time 60 https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
      chmod a+r /etc/apt/keyrings/docker.asc
      printf 'deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable\n' > /etc/apt/sources.list.d/docker.list
      apt-get update
      DEBIAN_FRONTEND=noninteractive apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
      mkdir -p /etc/systemd/system/docker.service.d
      printf '[Unit]\nRequiresMountsFor=/var/lib/docker\n' > /etc/systemd/system/docker.service.d/hero-storage.conf
      printf '{"log-driver":"json-file","log-opts":{"max-size":"10m","max-file":"3"}}\n' > /etc/docker/daemon.json
      systemctl daemon-reload
      systemctl restart docker
      install -d -m 0700 /opt/hero-open-wearables
      touch /var/lib/hero-wearables-host-ready
runcmd:
  - [bash, /usr/local/sbin/hero-wearables-host-setup]
